name: Final CICD Pipeline (ECR (OIDC))

on:
  push:
    branches:
      - master

env:
  IMAGE_TAG: master-${{ github.sha }}

# CRITICAL — OIDC requires these permissions
# Without this block OIDC will fail
permissions:
  id-token: write   # allows GitHub to request OIDC token
  contents: read    # allows checkout

jobs:

  # ── JOB 1 — BUILD AND PUSH TO ECR ──────────────────────────

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # Step 1 — Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 — Configure AWS credentials using OIDC
      # No keys — GitHub exchanges OIDC token for AWS role
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3 — Login to ECR
      # Uses the assumed role credentials automatically
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4 — Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5 — Build and Push to ECR
      - name: Build and Push to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./python-app
          file: ./python-app/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:master-${{ github.sha }}

  # ── JOB 2 — DEPLOY TO EKS ───────────────────────────────────

  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: build-and-push        # only runs if build job succeeds

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Replace image tag in manifest
        run: |
          sed -i "s|${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}*|${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}|g" \
            python-app/config/deployment.yaml

      - name: Deploy to EKS
        run: kubectl apply -f python-app/config/deployment.yaml

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/observability-demo-app -n app \
            --timeout=120s
