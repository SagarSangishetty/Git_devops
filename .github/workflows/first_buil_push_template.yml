name : Build & Push To Docker Hub 

on :
    push :
        branches :
            - master

env :
    environment : dev   #Work Flow Level Env

jobs :
    build-and-push :
        runs-on: ubuntu-latest

        steps :
            
            # Step 1 — Checkout code
            - name: Checkout Repository
              uses: actions/checkout@v4

            
            # Step 2 — Login to Docker Hub
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USER }}
                password: ${{ secrets.DOCKER_PASSWORD }}

             # Step 3 — Set up Docker Buildx
             # Buildx is needed for advanced builds
             # Always include this — company standard
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Step 4 — Build and Push
            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                    context: ./python-app
                    file: ./python-app/Dockerfile
                    push: true
                    tags:  ${{ secrets.DOCKER_USER }}/my-first-github-app:latest
                           ${{ secrets.DOCKER_USER }}/my-first-github-app:master-${{ github.sha }}